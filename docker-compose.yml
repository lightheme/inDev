version: "3.9"

services:
  mongo:
    image: mongo:7
    container_name: mongo
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      # Mongo "жив" (отвечает на ping) без auth
      test: ["CMD-SHELL", "mongosh --quiet mongodb://localhost:27017/admin --eval \"db.adminCommand('ping').ok\" | grep -q 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  mongo-init:
    image: mongo:7
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    command: >
      bash -lc "
      mongosh --quiet mongodb://mongo:27017/admin --eval \"
        const cfg = { _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] };

        function initiated() {
          try { return rs.status().ok === 1; } catch (e) { return false; }
        }

        if (!initiated()) {
          print('Initializing replica set...');
          rs.initiate(cfg);
        } else {
          print('Replica set already initialized.');
        }

        // Подождать, пока узел станет PRIMARY (или хотя бы OK)
        let attempts = 60;
        while (attempts-- > 0) {
          try {
            const s = rs.status();
            const st = (s.members && s.members[0] && s.members[0].stateStr) ? s.members[0].stateStr : 'unknown';
            if (s.ok === 1 && (st === 'PRIMARY' || st === 'SECONDARY' || st === 'STARTUP2')) {
              print('Replica set status ok, state:', st);
              break;
            }
          } catch (e) {}
          sleep(1000);
        }
      \";
      "

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3000
      FRONTEND_URLS: http://localhost:5173,http://127.0.0.1:5173

      # Без auth. ВАЖНО: replicaSet=rs0 нужен, если ты используешь транзакции / change streams / etc.
      MONGODB_URI: mongodb://mongo:27017/auction?replicaSet=rs0

      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""

      BOT_TOKEN: ""
      TELEGRAM_AUTH_MAX_AGE_SECONDS: 86400
      DEV_AUTH_JWT_SECRET: dev-secret
      DEV_AUTH_TTL_SECONDS: 604800
      DEV_AUTH_USERS: '[{"login":"admin","password":"admin123","userId":123,"role":"admin"}]'
    ports:
      - "3000:3000"
    volumes:
      - ./backend/src:/app/src
      - ./backend/tsconfig.json:/app/tsconfig.json

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # Для запросов из браузера правильно localhost
      VITE_API_BASE_URL: http://localhost:3000/api
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - ./frontend/tsconfig.json:/app/tsconfig.json
      - ./frontend/tsconfig.node.json:/app/tsconfig.node.json

volumes:
  mongo_data:
  redis_data:
